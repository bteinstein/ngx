[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngxprices"
version = "0.2.0"
description = "Download and parse Nigerian Exchange (NGX) daily equity prices, volume and metadata"
requires-python = ">=3.9"
dependencies = ["requests", "pdfplumber"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ngxprices = "ngxprices.cli:_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["network: tests that hit ngxgroup.com"]
